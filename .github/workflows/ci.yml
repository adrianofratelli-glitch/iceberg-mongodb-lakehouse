name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Placeholder only, never contacted: the offline suite mocks every MongoClient,
      # but mongo_side refuses to build a client when MONGODB_URI is empty.
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements*.txt
      - run: pip install -r requirements.txt -r backend/requirements-dev.txt
      - run: python -m compileall -q backend scripts
      # test_live_cdc_adversarial.py is skipped unless LIVE_ATLAS=1 (needs Atlas).
      - run: python -m pytest -q -rs backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.test.mjs
